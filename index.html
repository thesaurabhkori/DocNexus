<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocNexus</title>
    <style>
      #app-startup-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(248, 250, 252, 0.95);
      }
      #app-startup-loader .startup-shell {
        width: min(100%, 1240px);
        max-height: 100%;
        overflow-y: auto;
        border-radius: 2rem;
        padding: 2rem;
        background: #ffffff;
        box-shadow: 0 32px 80px rgba(15, 23, 42, 0.08);
      }
      #app-startup-loader .header-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
      }
      #app-startup-loader .skeleton {
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(226, 232, 240, 0.9), rgba(203, 213, 225, 0.6));
        animation: skeletonPulse 1.5s ease-in-out infinite;
      }
      #app-startup-loader .hero {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 2rem;
        align-items: center;
        margin-top: 2rem;
      }
      #app-startup-loader .hero-left {
        display: grid;
        gap: 1rem;
      }
      #app-startup-loader .hero-right {
        min-height: 340px;
        position: relative;
        overflow: hidden;
        border-radius: 2rem;
        background: linear-gradient(180deg, rgba(226, 232, 240, 0.75), rgba(241, 245, 249, 0.85));
      }
      #app-startup-loader .hero-right::before {
        content: "";
        position: absolute;
        top: -24px;
        left: -24px;
        width: 120px;
        height: 120px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.18);
      }
      #app-startup-loader .hero-right::after {
        content: "";
        position: absolute;
        bottom: -24px;
        right: -24px;
        width: 140px;
        height: 140px;
        border-radius: 999px;
        background: rgba(236, 72, 153, 0.14);
      }
      #app-startup-loader .hero-right .graphic {
        position: absolute;
        inset: 22px;
        border-radius: 1.75rem;
        background: rgba(203, 213, 225, 0.65);
        animation: skeletonPulse 1.5s ease-in-out infinite;
      }
      #app-startup-loader .input-card {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      #app-startup-loader .input-box {
        height: 56px;
        border-radius: 1.5rem;
        background: linear-gradient(90deg, rgba(226, 232, 240, 0.95), rgba(203, 213, 225, 0.7));
        animation: skeletonPulse 1.5s ease-in-out infinite;
      }
      #app-startup-loader .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 1rem;
      }
      #app-startup-loader .actions .btn {
        height: 48px;
        min-width: 160px;
        flex: 1 1 160px;
        background: linear-gradient(90deg, rgba(226, 232, 240, 0.95), rgba(203, 213, 225, 0.7));
        animation: skeletonPulse 1.5s ease-in-out infinite;
      }
      #app-startup-loader .tools-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }
      #app-startup-loader .tool-card {
        min-height: 150px;
        padding: 1.25rem;
        border-radius: 1.75rem;
        background: linear-gradient(180deg, rgba(226, 232, 240, 0.85), rgba(241, 245, 249, 0.9));
        animation: skeletonPulse 1.5s ease-in-out infinite;
      }
      #app-startup-loader .bottom-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 2rem;
      }
      #app-startup-loader .bottom-bar {
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(226, 232, 240, 0.92), rgba(203, 213, 225, 0.72));
        animation: skeletonPulse 1.5s ease-in-out infinite;
      }
      @keyframes skeletonPulse {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 0.55; }
      }
      @media (max-width: 980px) {
        #app-startup-loader .hero { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        #app-startup-loader .header-row,
        #app-startup-loader .actions,
        #app-startup-loader .bottom-row,
        #app-startup-loader .tools-grid {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-startup-loader">
      <div class="startup-shell">
        <div class="header-row">
          <div class="skeleton" style="width: 140px; height: 44px;
            border-radius: 22px;"></div>
          <div class="skeleton" style="width: 220px; height: 40px;
            border-radius: 999px;"></div>
          <div class="skeleton" style="width: 120px; height: 40px;
            border-radius: 999px;"></div>
        </div>

        <div class="hero">
          <div class="hero-left">
            <div class="skeleton" style="width: 85%; height: 72px;
              border-radius: 32px;"></div>
            <div class="skeleton" style="width: 68%; height: 22px;
              border-radius: 999px;"></div>
            <div class="skeleton" style="width: 100%; height: 14px;
              border-radius: 999px;"></div>
            <div class="skeleton" style="width: 92%; height: 14px;
              border-radius: 999px;"></div>
            <div class="skeleton" style="width: 76%; height: 14px;
              border-radius: 999px;"></div>
            <div class="input-card">
              <div class="input-box"></div>
              <div class="actions">
                <div class="btn"></div>
                <div class="btn"></div>
              </div>
            </div>
          </div>
          <div class="hero-right">
            <div class="graphic"></div>
          </div>
        </div>

        <div class="tools-grid">
          <div class="tool-card"></div>
          <div class="tool-card"></div>
          <div class="tool-card"></div>
          <div class="tool-card"></div>
          <div class="tool-card"></div>
          <div class="tool-card"></div>
        </div>

        <div class="bottom-row">
          <div class="bottom-bar"></div>
          <div class="bottom-bar"></div>
          <div class="bottom-bar"></div>
        </div>
      </div>
    </div>
    <div id="root" style="display: none;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
